<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4d3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Notatkart</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" />
    <link rel="stylesheet" href="styles.css?v=26" />
    <script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js" defer></script>
    <script src="https://unpkg.com/shpjs@6.2.0/dist/shp.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script src="app.js?v=72" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="top-left"><div class="brand"><span class="brand-mark">⌖</span><div><p>BEFARING</p><h1>Notatkart</h1></div></div><div class="project-controls"><button id="project-menu-toggle" class="secondary" type="button" aria-expanded="false">Prosjekt</button><input id="project-name" type="text" aria-label="Prosjektnavn" placeholder="Prosjektnavn"><div id="project-menu" class="project-menu" hidden><button id="new-project" type="button">Nytt prosjekt</button><button id="switch-project" type="button" aria-expanded="false">Bytt prosjekt</button><select id="project-select" aria-label="Velg prosjekt" hidden></select><div id="project-import-content"></div></div></div></div>
        <div class="top-actions"><div class="top-tool"><button id="draw-menu-toggle" class="secondary" type="button" aria-expanded="false">Tegne</button><div id="draw-menu" class="top-dropdown" hidden><div id="draw-menu-content"></div></div></div><button id="save-position-now" class="secondary" type="button">Lagre posisjon</button><button id="track-direct" class="secondary" type="button">Start sporlogg</button><button id="locate-button" class="secondary">Min posisjon</button><div class="top-tool"><button id="export-menu-toggle" class="primary" type="button" aria-expanded="false">Eksporter</button><div id="export-menu" class="top-dropdown" hidden><button id="export-button" type="button">Kartbilde (JPEG / UTM 32)</button><div id="export-project-content"></div></div></div></div>
      </header>
      <section class="map-area">
        <div id="map" aria-label="Kart"></div>
        <div id="quick-menu" class="quick-menu" hidden><button id="close-quick-menu" class="quick-menu-close" type="button" aria-label="Lukk hurtigmeny">×</button><button data-quick="note" type="button">Notat</button><button data-quick="photo" type="button">Bilde</button><button data-quick="culvert" type="button">Stikkrenne</button><button data-quick="landing" type="button">Velteplass</button></div>
        <div id="map-scale" class="map-scale" aria-label="Målestokk"><span id="scale-ratio">1 : 2 000</span><span class="scale-line"><i id="scale-bar"></i></span><span id="scale-distance">50 m</span></div>
        <aside class="panel left-panel collapsed">
          <button class="panel-toggle" type="button" aria-expanded="false" aria-label="Åpne kartlag"><span class="panel-icon">▤</span><span>Kartlag</span></button>
          <h2>Kartlag</h2>
          <label class="toggle"><input id="base-toggle" type="checkbox" checked><span>Grunnkart <small>Kartverket</small></span></label>
          <label class="toggle"><input id="losmasser-toggle" type="checkbox"><span>Løsmassekart <small>NGU · sammenstilt visning</small></span></label>
          <label class="toggle"><input id="marin-leire-toggle" type="checkbox"><span>Mulighet for marin leire <small>NGU · overordnet aktsomhetsinformasjon</small></span></label>
          <label class="toggle"><input id="skogbruksplan-toggle" type="checkbox"><span>Hogstklasser <small>NIBIO · klasse 1–5</small></span></label>
          <label class="toggle"><input id="nokkelbiotoper-toggle" type="checkbox"><span>Nøkkelbiotoper <small>NIBIO · MiS</small></span></label>
          <label class="toggle"><input id="kulturminner-toggle" type="checkbox"><span>Kulturminner <small>Riksantikvaren</small></span></label>
          <label class="toggle"><input id="artskart-toggle" type="checkbox"><span>Artskart <small>Artsdata · arter i skog</small></span></label>
          <div class="layer-heading"><label class="toggle"><input id="import-toggle" type="checkbox" checked><span>Importerte data <small id="import-count">0 objekt</small></span></label><button id="import-expand" class="layer-expand" type="button" aria-label="Vis importerte data" aria-expanded="false">⌄</button></div>
          <div id="import-list" class="layer-submenu" hidden></div>
          <div class="layer-heading"><label class="toggle"><input id="notes-toggle" type="checkbox" checked><span>Notater og skisser <small id="note-count">0 objekt</small></span></label><button id="notes-expand" class="layer-expand" type="button" aria-label="Vis notater og skisser" aria-expanded="false">⌄</button></div>
          <div id="notes-list" class="layer-submenu" hidden></div>
          <hr>
          <label for="import-projection">Koordinatsystem ved import</label>
          <select id="import-projection"><option value="EPSG:25832" selected>ETRS89 / UTM sone 32 (anbefalt)</option><option value="EPSG:25833">ETRS89 / UTM sone 33</option><option value="EPSG:32632">WGS 84 / UTM sone 32</option><option value="EPSG:32633">WGS 84 / UTM sone 33</option></select>
          <label class="file-button" for="shape-input">Importer kartdata</label>
          <input id="shape-input" type="file" accept=".zip,.dxf,.xml,.tif,.tiff,.pdf,application/zip,application/xml,text/xml,application/pdf,image/tiff" multiple hidden>
          <p class="hint">Støtter shapefil-ZIP, kartpakker, DXF, LandXML, GeoTIFF og GeoPDF. Velg UTM-sone for filer uten innebygget koordinatsystem.</p>
          <div class="project-transfer"><button id="export-project" class="secondary wide" type="button">Eksporter prosjekt</button><label class="file-button" for="project-input">Importer prosjekt</label><input id="project-input" type="file" accept=".notatkart,application/zip" hidden></div>
        </aside>
        <aside class="panel right-panel collapsed">
          <button class="panel-toggle" type="button" aria-expanded="false" aria-label="Åpne verktøy"><span class="panel-icon">＋</span><span>Legg til</span></button>
          <h2>Legg til</h2>
          <div class="tool-grid">
            <button data-draw="freehand">Frihånd</button><button data-draw="LineString">Linje</button><button data-draw="Polygon">Område</button>
          </div>
          <label for="draw-color">Farge for linje og frihånd</label>
          <select id="draw-color"><option value="#dc6f45" selected>Rød</option><option value="#317356">Grønn</option><option value="#e0ad24">Gul</option></select>
          <hr>
          <button id="text-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="text-content">Tekstboks</button>
          <div id="text-content" class="tool-content" hidden>
            <label for="note-title">Overskrift</label>
            <input id="note-title" type="text" placeholder="Overskrift (valgfritt)">
            <label for="note-text">Tekst</label>
            <textarea id="note-text" rows="3" placeholder="Skriv notat …"></textarea>
            <button id="place-text" class="primary wide">Tegn tekstboks i kartet</button>
          </div>
          <hr>
          <button id="position-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="position-content">Lagre posisjon</button>
          <div id="position-content" class="tool-content" hidden>
            <label for="position-title">Overskrift</label>
            <input id="position-title" type="text" placeholder="Overskrift (valgfritt)">
            <label for="position-text">Notat</label>
            <textarea id="position-text" rows="2" placeholder="Notat til denne posisjonen …"></textarea>
            <button id="save-position" class="primary wide" type="button">Lagre min posisjon</button>
          </div>
          <hr>
          <button id="track-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="track-content">Sporlogg</button>
          <div id="track-content" class="tool-content" hidden>
            <p class="hint">Maks lengde: 10 km.</p>
            <button id="start-track" class="primary wide" type="button">Start sporlogg</button>
            <button id="stop-track" class="secondary wide" type="button" disabled>Stopp og lagre spor</button>
            <p id="track-status" class="hint">Ingen aktiv sporlogg.</p>
          </div>
          <hr>
          <button id="symbol-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="symbol-content">Symboler</button>
          <div id="symbol-content" class="symbol-content" hidden>
            <label for="symbol-type">Velg symbol</label>
            <select id="symbol-type"><option value="" selected disabled>Velg symbol …</option><option value="culvert">Stikkrenne</option><option value="landing">Velteplass</option><option value="turning">Snuplass</option><option value="arrow-left">Gul pil venstre</option><option value="arrow-right">Gul pil høyre</option></select>
            <label for="symbol-text">Diameter / valgfri tekst</label>
            <input id="symbol-text" type="text" placeholder="For eksempel Ø 600 mm">
          </div>
          <hr>
          <button id="photo-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="photo-content">Bilde</button>
          <div id="photo-content" class="tool-content" hidden>
            <label class="file-button" for="photo-input">Velg eller ta bilde</label>
            <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
            <p id="photo-name" class="hint">Ingen bilde valgt.</p>
            <button id="place-photo" class="primary wide" disabled>Plasser bilde i kartet</button>
          </div>
          <hr>
          <button id="cancel-tool" class="secondary wide">Avbryt aktivt verktøy</button>
        </aside>
        <aside id="detail-card" class="detail-card" hidden>
          <button id="close-detail" class="close-button" aria-label="Lukk">×</button>
          <p class="detail-type" id="detail-type"></p><h2 id="detail-title"></h2><p id="detail-body"></p><a id="detail-link" class="detail-link" target="_blank" rel="noopener" hidden>Åpne mer informasjon</a><img id="detail-photo" alt="Kartfestet bilde" hidden>
          <div id="symbol-editor" class="symbol-editor" hidden>
            <label for="edit-symbol-type">Symboltype</label><select id="edit-symbol-type"><option value="text">Notat</option><option value="culvert">Stikkrenne</option><option value="landing">Velteplass</option><option value="turning">Snuplass</option><option value="arrow-left">Gul pil venstre</option><option value="arrow-right">Gul pil høyre</option></select>
            <label for="edit-symbol-text">Tekst ved symbol</label><input id="edit-symbol-text" type="text">
            <div id="culvert-rotation" hidden><label for="edit-symbol-rotation">Rotasjon <output id="edit-symbol-rotation-value">0°</output></label><input id="edit-symbol-rotation" type="range" min="0" max="350" step="10" value="0"></div>
            <button id="save-symbol" class="primary wide" type="button">Lagre endringer</button>
          </div>
          <div id="text-editor" class="symbol-editor" hidden>
            <label for="edit-note-type">Objekttype</label><select id="edit-note-type"><option value="text">Notat</option><option value="culvert">Stikkrenne</option><option value="landing">Velteplass</option><option value="turning">Snuplass</option><option value="arrow-left">Gul pil venstre</option><option value="arrow-right">Gul pil høyre</option></select>
            <label for="edit-note-title">Overskrift</label><input id="edit-note-title" type="text" placeholder="Overskrift (valgfritt)">
            <label for="edit-note-text">Tekst</label><textarea id="edit-note-text" rows="4" placeholder="Skriv notat …"></textarea>
            <button id="save-text-note" class="primary wide" type="button">Lagre endringer</button>
          </div>
          <div id="line-style-editor" class="symbol-editor" hidden><label for="edit-sketch-color">Linjefarge</label><select id="edit-sketch-color"><option value="#dc6f45">Rød</option><option value="#317356">Grønn</option><option value="#e0ad24">Gul</option></select><button id="save-sketch-style" class="primary wide" type="button">Lagre linjestil</button></div>
          <div id="symbol-actions" class="symbol-actions" hidden></div><button id="edit-geometry" class="secondary wide" type="button" hidden>Rediger punkter</button>
          <button id="delete-object" class="danger">Slett objekt</button>
        </aside>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <p class="attribution">Grunnkart © Kartverket</p>
      </section>
    </main>
  </body>
</html>
